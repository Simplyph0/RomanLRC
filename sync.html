<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LRC Sync Tester</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --bd:#d6d6d6; --pane:#fafafa; --acc:#2a62d9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e8e8e8; --mut:#9aa0a6; --bd:#33373d; --pane:#1d2025; --acc:#6b9bff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--bd); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header a { color: var(--acc); font-size: 13px; }
  label { color: var(--mut); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  select, button, input[type=number] { font: inherit; font-size: 13px; background: var(--pane); color: var(--fg); border: 1px solid var(--bd); border-radius: 6px; padding: 4px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--acc); }
  input[type=number] { width: 90px; }
  .grp { display: inline-flex; gap: 4px; align-items: center; }
  #time { font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--mut); min-width: 60px; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  section + section { border-left: 1px solid var(--bd); }
  @media (max-width: 700px) { section + section { border-left: 0; border-top: 1px solid var(--bd); } }
  .bar { padding: 6px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); display: flex; gap: 8px; align-items: center; }
  .bar span { margin-right: auto; }
  textarea, #play { flex: 1; margin: 0; padding: 8px 16px 16px; border: 0; outline: 0; resize: none; background: var(--pane); color: var(--fg); overflow: auto; min-height: 0; }
  textarea { font: 14px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre; }
  #play .l { padding: 3px 8px; border-radius: 6px; color: var(--mut); cursor: pointer; font-size: 17px; }
  #play .l.on { color: var(--fg); background: color-mix(in srgb, var(--acc) 20%, transparent); font-weight: 600; }
  #play .l:hover { border: 0; background: color-mix(in srgb, var(--acc) 10%, transparent); }
  .drop { outline: 2px dashed var(--acc); outline-offset: -6px; }
</style>
</head>
<body>
<header>
  <h1>LRC Sync Tester</h1>
  <a href="index.html">← Romanizer</a>
  <span class="grp">
    <button id="playbtn">▶ Play</button>
    <button id="restart" title="Back to start">⏮</button>
    <span id="time">0:00.0</span>
  </span>
  <button id="audiobtn">Load audio (optional)…</button>
  <input type="file" id="audiofile" accept="audio/*,video/*" hidden>
  <span class="grp">
    <label>Shift</label>
    <button data-d="-1000">−1s</button><button data-d="-100">−100</button><button data-d="-10">−10</button>
    <input type="number" id="shift" value="0" step="10"> <label>ms</label>
    <button data-d="10">+10</button><button data-d="100">+100</button><button data-d="1000">+1s</button>
    <button id="zero">Reset</button>
  </span>
  <label>Apply as
    <select id="mode"><option value="stamps">Rewritten timestamps</option><option value="tag">[offset:] tag (old style)</option></select>
  </label>
  <span id="hint" style="color:var(--mut);font-size:12px">+ = lyrics later, − = earlier</span>
</header>
<main>
  <section>
    <div class="bar"><span>Lyrics (paste or drop .lrc)</span><button id="open">Open…</button><button id="clear">Clear</button></div>
    <textarea id="in" spellcheck="false" placeholder="Paste LRC here, or drop a file…"></textarea>
    <input type="file" id="file" accept=".lrc,.txt,text/plain" hidden>
  </section>
  <section>
    <div class="bar"><span>Live preview</span><button id="copy">Copy adjusted</button><button id="save">Download adjusted</button></div>
    <div id="play"></div>
  </section>
</main>
<audio id="audio" hidden></audio>

<script src="lrcsync.js"></script>
<script>
const $ = id => document.getElementById(id);
const inp = $('in'), play = $('play'), audio = $('audio');
let lines = [], els = [], useAudio = false, clock = 0, running = false, last = 0;

const shiftMs = () => parseInt($('shift').value, 10) || 0;
const adjusted = () => LrcSync.shift(inp.value, shiftMs(), $('mode').value);

function build() {
  lines = LrcSync.parse(inp.value);
  play.textContent = '';
  els = lines.map((l, i) => {
    const d = document.createElement('div');
    d.className = 'l'; d.textContent = l.text || '♪';
    d.onclick = () => seek(Math.max(0, (l.t + shiftMs()) / 1000));
    play.appendChild(d); return d;
  });
  if (!lines.length) play.textContent = 'No timestamped lines found.';
  tick(true);
}

const now = () => useAudio ? audio.currentTime : clock;
function seek(s) { if (useAudio) audio.currentTime = s; else clock = s; tick(true); }

let activeIdx = -2;
function tick(force) {
  const t = now() * 1000;
  $('time').textContent = Math.floor(t / 60000) + ':' + ((t % 60000) / 1000).toFixed(1).padStart(4, '0');
  const sh = shiftMs();
  let a = -1;
  for (let i = 0; i < lines.length; i++) { if (lines[i].t + sh <= t) a = i; else break; }
  if (a !== activeIdx || force) {
    if (els[activeIdx]) els[activeIdx].classList.remove('on');
    activeIdx = a;
    if (els[a]) { els[a].classList.add('on'); els[a].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }
}
function loop(ts) {
  if (!running) return;
  if (!useAudio) { clock += (ts - last) / 1000; }
  last = ts; tick();
  requestAnimationFrame(loop);
}
function setRunning(r) {
  running = r; $('playbtn').textContent = r ? '⏸ Pause' : '▶ Play';
  if (useAudio) r ? audio.play() : audio.pause();
  if (r) { last = performance.now(); requestAnimationFrame(loop); }
}
$('playbtn').onclick = () => setRunning(!running);
$('restart').onclick = () => seek(0);
audio.onended = () => setRunning(false);

$('audiobtn').onclick = () => $('audiofile').click();
$('audiofile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  setRunning(false);
  audio.src = URL.createObjectURL(f); useAudio = true;
  $('audiobtn').textContent = '♪ ' + f.name;
  tick(true);
};

function setShift(v) { $('shift').value = v; tick(true); }
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => setShift(shiftMs() + +b.dataset.d));
$('shift').oninput = () => tick(true);
$('zero').onclick = () => setShift(0);

inp.addEventListener('input', build);
$('clear').onclick = () => { inp.value = ''; build(); inp.focus(); };
$('open').onclick = () => $('file').click();
$('file').onchange = e => readFile(e.target.files[0]);
function readFile(f) { if (f) f.text().then(t => { inp.value = t; build(); }); }
[inp, play].forEach(el => {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drop'); });
  el.addEventListener('dragleave', () => el.classList.remove('drop'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drop'); readFile(e.dataTransfer.files[0]); });
});

$('copy').onclick = async () => { await navigator.clipboard.writeText(adjusted()); $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy adjusted', 1000); };
$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([adjusted()], { type: 'text/plain;charset=utf-8' }));
  a.download = 'adjusted.lrc'; a.click(); URL.revokeObjectURL(a.href);
};

inp.value = `[ti:Sample]\n[00:01.00]First line\n[00:04.00]Second line\n[00:07.50]Third line\n[00:11.00]Fourth line`;
build();
</script>
</body>
</html>
